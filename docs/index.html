<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17131f">
    <meta name="description" content="A short demo of Dim for Omarchy.">
    <title>Dim demo</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #17131f; color: #f1edf8; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 960px); }
      a { color: #d4bcff; }
      .brand { display: inline-block; margin-bottom: 12px; text-decoration: none; font-weight: 650; }
      h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.4rem); }
      p { margin: 8px 0 20px; color: #b9b0c7; }
      video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; background: #09080c; border-radius: 12px; }
      .download { margin-top: 12px; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="https://github.com/yogeshsuryag/oma.dim">Dim for Omarchy</a>
      <h1>Watch the 15-second demo</h1>
      <p>Dim your displays with a black overlay, then adjust its strength from the display panel.</p>
      <video controls playsinline preload="metadata" poster="assets/dim-demo-poster.png">
        <source src="assets/dim-demo.mp4" type="video/mp4">
        Your browser cannot play this video. <a href="assets/dim-demo.mp4">Download the MP4</a>.
      </video>
      <p class="download"><a href="assets/dim-demo.mp4" download>Download the MP4</a></p>
    </main>
  </body>
</html>
